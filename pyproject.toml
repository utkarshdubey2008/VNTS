[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vnts"
version = "0.1.0"
description = "VYOMA Neural Training Systems: Independent research into novel neural network training paradigms."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "VNTS Contributors"}
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "psutil>=5.9.0"
]

[project.scripts]
vnts-benchmark = "vnts.run_experiments:main"

[tool.setuptools.packages.find]
where = ["src"]
