[package]
name = "vnts-core"
version = "0.1.0"
edition = "2021"
authors = ["VNTS Research Team"]
description = "High-Performance Native Engine for Vector Nullspace Transformation System"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "vnts-cli"
path = "src/bin/vnts_cli.rs"
